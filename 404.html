<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PDW4NPHHW8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PDW4NPHHW8');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找不到頁面 / 頁面自動跳轉中... | Big Fame IND. CORP.</title>
  <link rel="stylesheet" href="/css/bf-architectural.css">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // 智慧相容性自動轉向 (Smart Legacy & Direct Slug Resolver)
    (function() {
      var path = window.location.pathname;
      var cleanSlug = path.replace(/^\/+|\/+$/g, '').replace(/\.html$/, '');
      
      // 已包含語系前綴的不用轉
      if (cleanSlug.startsWith('tw/') || cleanSlug.startsWith('en/') || cleanSlug.startsWith('jp/')) {
        return;
      }
      
      // 依使用者偏好或瀏覽器語言決定語系 (預設 tw)
      var savedLang = localStorage.getItem('bf_lang');
      var userLang = navigator.language || navigator.userLanguage || 'zh-TW';
      var targetLocale = 'tw';
      if (savedLang === 'en' || (!savedLang && userLang.toLowerCase().startsWith('en'))) {
        targetLocale = 'en';
      } else if (savedLang === 'jp' || (!savedLang && userLang.toLowerCase().startsWith('ja'))) {
        targetLocale = 'jp';
      }

      if (cleanSlug === '' || cleanSlug === 'index') {
        window.location.replace('/' + targetLocale + '/');
        return;
      }

      // 如果存取 /optical-hooks 或 /optical-hooks.html，轉向 /{locale}/optical-hooks
      window.location.replace('/' + targetLocale + '/' + cleanSlug);
    })();
  </script>
</head>
<body style="background: #fbfbfa; color: #111315; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <main class="section" style="min-height: 100vh; display: grid; place-items: center; padding: 24px;">
    <div class="container" style="max-width: 640px; text-align: center; background: #ffffff; border: 1px solid #e6e6e2; padding: 48px 32px; box-shadow: 0 12px 32px rgba(0,0,0,0.04);">
      <span style="font-family: monospace; font-size: 0.75rem; letter-spacing: 0.15em; color: #b89b72; font-weight: 600;">404 // SMART ROUTING DISPATCHER</span>
      <h1 style="font-size: 1.8rem; font-weight: 600; margin: 16px 0 12px 0;">頁面轉向中或找不到此頁面</h1>
      <p style="color: #5a5f66; font-size: 0.92rem; line-height: 1.6; margin-bottom: 32px;">
        若系統未自動跳轉至正確語系頁面，請點選下方語言或聯絡工程團隊。
      </p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a class="btn btn-primary" href="/tw/" style="padding: 10px 20px; font-size: 0.82rem; font-weight: 600; background: #111315; color: #ffffff;">繁中首頁</a>
        <a class="btn btn-secondary" href="/en/" style="padding: 10px 20px; font-size: 0.82rem; font-weight: 600; border: 1px solid #111315; color: #111315;">English Home</a>
        <a class="btn btn-secondary" href="/jp/" style="padding: 10px 20px; font-size: 0.82rem; font-weight: 600; border: 1px solid #111315; color: #111315;">日本語トップ</a>
      </div>
    </div>
  </main>
</body>
</html>
