name: Refresh branch preview from main
on:
  workflow_run:
    workflows: ['Publish main and JP preview']
    branches: ['codex/jp-taste-refinement-20261006']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: bigfame-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          persist-credentials: false
      - name: Checkout preview source
        uses: actions/checkout@v4
        with:
          ref: codex/jp-taste-refinement-20261006
          path: preview-source
          persist-credentials: false
      - name: Build comparison site
        run: python production/scripts/build_pages_comparison.py --main production --preview preview-source --output _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
